name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore SimpleDMS.slnx
      - run: dotnet build SimpleDMS.slnx -c Release --no-restore
      - run: dotnet test SimpleDMS.slnx -c Release --no-build --logger trx
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: tests-${{ matrix.os }}
          path: tests/**/TestResults/*.trx
